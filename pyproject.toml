[tool.poetry]
name = "ai-hedge-fund"
version = "1.0.0"
description = "An AI-powered hedge fund that uses multiple agents to make trading decisions"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [
    { include = "src", from = "." },
    { include = "app", from = "." }
]

[tool.poetry.dependencies]
python = "^3.11"
langchain = "^1.3.9"
langchain-anthropic = "^1.4.6"
langchain-groq = "^1.1.3"
langchain-openai = "^1.1.14"
langchain-deepseek = "^1.1.0"
langchain-ollama = "^1.0.1"
langgraph = "^1.2.11"
pandas = "^2.1.0"
numpy = "^1.24.0"
python-dotenv = "1.2.3"
matplotlib = "^3.9.2"
tabulate = "^0.9.0"
colorama = "^0.4.6"
questionary = "^2.1.0"
rich = "^13.9.4"
langchain-google-genai = "^4.4.0"
# Backend dependencies
fastapi = {extras = ["standard"], version = "^0.141.1"}
fastapi-cli = "^0.0.32"
pydantic = "^2.4.2"
httpx = "^0.28.1"
sqlalchemy = "^2.0.22"
alembic = "^1.12.0"
langchain-gigachat = "^0.5.1"
langchain-xai = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
black = "^26.3.1"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 420
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true

[tool.poetry.scripts]
backtester = "src.backtesting.cli:main"